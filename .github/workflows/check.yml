name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install SSH test dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: HERDR_TEST_PYTHON="$(command -v python)" ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleUxTest :app:lintDebug --console=plain
      - name: Reject skipped JVM tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'No JVM test reports found'
          suites = [ET.parse(report).getroot() for report in reports]
          for key in ('failures', 'errors', 'skipped'):
              count = sum(int(suite.get(key, '0')) for suite in suites)
              assert count == 0, f'{key}: {count}'
          assert any(suite.get('name', '').endswith('HerdrClientTransportTest') for suite in suites), 'SSH transport suite missing'
          PY
      - name: Check Python fixture
        run: python -m unittest discover -s tools -p 'test_dev_fake_ssh.py' -v
